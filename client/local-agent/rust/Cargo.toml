[package]
name = "ogvcs-local-agent-ipc"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Private bounded OpenGameVCS local-agent IPC fact and ledger candidate"
readme = "README.md"
repository = "https://github.com/n3r/OpenGameVCS"
publish = false
include = [
    "src/**",
    "tests/**",
    "scripts/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[lib]
path = "src/lib.rs"

[dependencies]
ogvcs-object-model = { version = "0.1.0", path = "../../../core/object-model/rust" }
ogvcs-path-contract = { version = "1.0.0", path = "../../../core/paths-filesystem/rust" }
opengamevcs-protocol-v1 = { version = "1.0.0-rc.1", path = "../../../foundation/protocol-baseline/bindings/rust" }
serde = "=1.0.229"
serde_json = "=1.0.151"
