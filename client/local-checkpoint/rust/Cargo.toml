[package]
name = "ogvcs-local-checkpoint"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Private bounded OpenGameVCS local-checkpoint metadata candidate"
readme = "README.md"
repository = "https://github.com/n3r/OpenGameVCS"
publish = false
include = [
    "src/**",
    "scripts/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[lib]
path = "src/lib.rs"

[dependencies]
ogvcs-chunking-manifest = { path = "../../../core/chunking-manifest/rust", version = "0.1.0" }
ogvcs-object-model = { path = "../../../core/object-model/rust", version = "0.1.0" }
ogvcs-path-contract = { path = "../../../core/paths-filesystem/rust", version = "1.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
