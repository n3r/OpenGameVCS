name: Chunking manifest bounded conformance

on:
  pull_request:
    paths:
      - '.github/workflows/chunking-manifest-bounded.yml'
      - '.github/workflows/chunking-manifest-scale.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'core/chunking-manifest/**'
      - 'core/object-model/**'
      - 'core/paths-filesystem/**'
      - 'foundation/benchmark-fault-harness/**'
      - 'spec/benchmark-fault/v1/**'
      - 'spec/chunking-manifest/v1/**'
      - 'tools/chunking-selection-*'
      - 'tools/chunking-scale-*'
      - 'tools/compare-chunking-scale*'
      - 'docs/evidence/OGVCS-007/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chunking-manifest-bounded.yml'
      - '.github/workflows/chunking-manifest-scale.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'core/chunking-manifest/**'
      - 'core/object-model/**'
      - 'core/paths-filesystem/**'
      - 'foundation/benchmark-fault-harness/**'
      - 'spec/benchmark-fault/v1/**'
      - 'spec/chunking-manifest/v1/**'
      - 'tools/chunking-selection-*'
      - 'tools/chunking-scale-*'
      - 'tools/compare-chunking-scale*'
      - 'docs/evidence/OGVCS-007/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunking-bounded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript bounded (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, label: Linux }
          - { runner: macos-latest, label: macOS }
          - { runner: windows-latest, label: Windows }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test --workspace @opengamevcs/chunking-manifest-contract-v1
      - run: npm run check --workspace @opengamevcs/chunking-manifest
      - run: npm run test --workspace @opengamevcs/chunking-manifest
      - run: npm run test:packed --workspace @opengamevcs/chunking-manifest
      - run: npm run test:chunking:report
      - run: node core/chunking-manifest/js/scripts/bounded-report.mjs artifacts/javascript.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunking-javascript-${{ matrix.label }}
          path: artifacts/javascript.json
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust bounded (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, label: Linux }
          - { runner: macos-latest, label: macOS }
          - { runner: windows-latest, label: Windows }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path core/chunking-manifest/rust/Cargo.toml -- --check
      - run: cargo test --manifest-path core/chunking-manifest/rust/Cargo.toml --locked
      - run: cargo clippy --manifest-path core/chunking-manifest/rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo package --manifest-path core/object-model/rust/Cargo.toml --locked --offline
      - run: cargo package --manifest-path core/chunking-manifest/rust/Cargo.toml --locked --offline --config 'patch.crates-io.ogvcs-object-model.path="core/object-model/rust"'
      - run: cargo run --manifest-path core/chunking-manifest/rust/Cargo.toml --locked --example bounded_report -- artifacts/rust.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunking-rust-${{ matrix.label }}
          path: artifacts/rust.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Cross-language and cross-OS parity
    needs: [javascript, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunking-javascript-Linux
          path: artifacts/javascript/Linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunking-javascript-macOS
          path: artifacts/javascript/macOS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunking-javascript-Windows
          path: artifacts/javascript/Windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunking-rust-Linux
          path: artifacts/rust/Linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunking-rust-macOS
          path: artifacts/rust/macOS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunking-rust-Windows
          path: artifacts/rust/Windows
      - run: >-
          node core/chunking-manifest/js/scripts/compare-bounded-reports.mjs
          artifacts/javascript/Linux/javascript.json
          artifacts/javascript/macOS/javascript.json
          artifacts/javascript/Windows/javascript.json
          artifacts/rust/Linux/rust.json
          artifacts/rust/macOS/rust.json
          artifacts/rust/Windows/rust.json
