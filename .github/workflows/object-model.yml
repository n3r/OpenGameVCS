name: Object model conformance

on:
  pull_request:
    paths:
      - ".github/workflows/object-model.yml"
      - ".gitattributes"
      - ".gitignore"
      - "adr/0008-*.md"
      - "adr/0009-*.md"
      - "adr/0010-*.md"
      - "adr/README.md"
      - "architecture.md"
      - "LICENSE*"
      - "core/object-model/**"
      - "docs/changelog/OGVCS-002.md"
      - "docs/evidence/OGVCS-002/**"
      - "docs/reviews/OGVCS-002-critical-review.md"
      - "foundation/fixture-generator/**"
      - "package.json"
      - "package-lock.json"
      - "prd/README.md"
      - "prd/ROADMAP.md"
      - "prd/TEMPLATE.md"
      - "prd/validate-roadmap.mjs"
      - "prd/validate-roadmap.test.mjs"
      - "prd/todo/OGVCS-002-*.md"
      - "prd/done/OGVCS-002-*.md"
      - "prd/todo/OGVCS-004-*.md"
      - "prd/todo/OGVCS-007-*.md"
      - "prd/todo/OGVCS-033-*.md"
      - "spec/repository-format/v1/**"
      - "tools/reference-vector-generator/**"
      - "tools/verify-reference-vectors.mjs"
      - "tools/verify-reference-vectors.test.mjs"
      - "tools/object-model-conformance-report.mjs"
      - "tools/object-model-conformance-report.test.mjs"
      - "tools/object-model-scenario-report-*.mjs"
      - "tools/run-packed-object-model-conformance.mjs"
      - "tools/compare-object-model-conformance.mjs"
      - "tools/compare-object-model-scale.mjs"
      - "tools/compare-object-model-scale.test.mjs"
  push:
    branches:
      - main
      - "ogvcs-002/**"
    paths:
      - ".github/workflows/object-model.yml"
      - ".gitattributes"
      - ".gitignore"
      - "adr/0008-*.md"
      - "adr/0009-*.md"
      - "adr/0010-*.md"
      - "adr/README.md"
      - "architecture.md"
      - "LICENSE*"
      - "core/object-model/**"
      - "docs/changelog/OGVCS-002.md"
      - "docs/evidence/OGVCS-002/**"
      - "docs/reviews/OGVCS-002-critical-review.md"
      - "foundation/fixture-generator/**"
      - "package.json"
      - "package-lock.json"
      - "prd/README.md"
      - "prd/ROADMAP.md"
      - "prd/TEMPLATE.md"
      - "prd/validate-roadmap.mjs"
      - "prd/validate-roadmap.test.mjs"
      - "prd/todo/OGVCS-002-*.md"
      - "prd/done/OGVCS-002-*.md"
      - "prd/todo/OGVCS-004-*.md"
      - "prd/todo/OGVCS-007-*.md"
      - "prd/todo/OGVCS-033-*.md"
      - "spec/repository-format/v1/**"
      - "tools/reference-vector-generator/**"
      - "tools/verify-reference-vectors.mjs"
      - "tools/verify-reference-vectors.test.mjs"
      - "tools/object-model-conformance-report.mjs"
      - "tools/object-model-conformance-report.test.mjs"
      - "tools/object-model-scenario-report-*.mjs"
      - "tools/run-packed-object-model-conformance.mjs"
      - "tools/compare-object-model-conformance.mjs"
      - "tools/compare-object-model-scale.mjs"
      - "tools/compare-object-model-scale.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
        with:
          components: clippy,rustfmt
      - name: Install JavaScript workspaces
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefetch complete locked Rust dependency closure
        run: cargo fetch --manifest-path core/object-model/rust/Cargo.toml --locked
      - name: Run full conformance from packed JavaScript, Rust, and format artifacts
        if: runner.os == 'Linux'
        run: node tools/run-packed-object-model-conformance.mjs --output artifacts/packed-object-model-conformance
      - name: Install the pinned normative CDDL compiler
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 install cddl --version 0.10.7 --locked
      - name: Check generated reference vectors
        run: node tools/reference-vector-generator/generate.mjs --check
      - name: Audit reference vectors independently of their generator
        run: npm run test:vectors
      - name: Validate format specification and registries
        run: npm run test:spec
      - name: Check JavaScript public package
        run: npm run check --workspace @opengamevcs/object-model
      - name: Require Windows junction scratch-confinement coverage
        if: runner.os == 'Windows'
        env:
          OGVCS_REQUIRE_WINDOWS_JUNCTION: "1"
        run: node --test --test-name-pattern="external sorter enforces scratch bounds" core/object-model/js/test/scale-stream.test.mjs
      - name: Test JavaScript implementation and fixture adapter
        run: npm run test --workspace @opengamevcs/object-model
      - name: Smoke-test bounded JavaScript scale runner and packaged CLI path
        run: npm run test:scale:smoke --workspace @opengamevcs/object-model
      - name: Check packaged Rust registry authority
        run: node core/object-model/rust/scripts/sync-registries.mjs --check
      - name: Check packaged Rust Unicode 15 authority
        run: node core/object-model/rust/scripts/sync-unicode.mjs --check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/object-model/rust/Cargo.toml --check
      - name: Test Rust implementation
        run: cargo test --manifest-path core/object-model/rust/Cargo.toml --locked
      - name: Lint Rust implementation
        run: cargo clippy --manifest-path core/object-model/rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build Rust package
        run: cargo package --manifest-path core/object-model/rust/Cargo.toml --locked --offline
      - name: Test reproducible Rust offline distribution
        run: node --test core/object-model/rust/scripts/offline-distribution.test.mjs
      - name: Build and verify Rust offline distribution
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          node core/object-model/rust/scripts/build-offline-distribution.mjs --output artifacts/ogvcs-object-model-offline-0.1.0
          node core/object-model/rust/scripts/build-offline-distribution.mjs --verify artifacts/ogvcs-object-model-offline-0.1.0
      - name: Pack the versioned format, registry, and vector artifact
        if: runner.os == 'Linux'
        run: npm pack ./spec/repository-format/v1 --pack-destination artifacts --ignore-scripts
      - name: Upload packed format conformance artifact
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ogvcs-repository-format-v1
          path: artifacts/opengamevcs-repository-format-v1-0.1.0.tgz
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Rust offline distribution
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ogvcs-object-model-rust-offline-Linux
          path: artifacts/ogvcs-object-model-offline-0.1.0
          if-no-files-found: warn
          retention-days: 30
      - name: Validate roadmap lifecycle
        if: runner.os == 'Linux'
        run: npm run test:roadmap
      - name: Test conformance report tooling
        if: runner.os == 'Linux'
        run: npm run test:object-model:ci-report
      - name: Write deterministic JavaScript conformance report
        run: node tools/object-model-conformance-report.mjs --output artifacts/object-model-javascript-${{ runner.os }}.json
      - name: Write deterministic Rust conformance report
        run: cargo run --manifest-path core/object-model/rust/Cargo.toml --locked --offline --bin object_model_scenario_report -- --conformance --output artifacts/object-model-rust-${{ runner.os }}.json
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-model-conformance-${{ runner.os }}
          path: |
            artifacts/object-model-javascript-${{ runner.os }}.json
            artifacts/object-model-rust-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload packed-artifact conformance evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-model-packed-conformance-Linux
          path: artifacts/packed-object-model-conformance
          if-no-files-found: warn
          retention-days: 30

  compare-conformance:
    name: Compare JavaScript and Rust on Linux, macOS, and Windows
    if: ${{ !cancelled() }}
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download platform reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: object-model-conformance-*
          path: artifacts/platforms
      - name: Require byte-identical conformance results
        run: node tools/compare-object-model-conformance.mjs --input artifacts/platforms --output artifacts/object-model-conformance-comparison.json
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-model-conformance-comparison
          path: artifacts/object-model-conformance-comparison.json
          if-no-files-found: warn
          retention-days: 30
