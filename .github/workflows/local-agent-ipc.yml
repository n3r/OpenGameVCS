name: R1 local-agent IPC candidate

on:
  pull_request:
    paths:
      - '.github/workflows/local-agent-ipc.yml'
      - 'client/local-agent/rust/**'
      - 'core/object-model/rust/**'
      - 'core/paths-filesystem/rust/**'
      - 'foundation/protocol-baseline/bindings/rust/**'
      - 'docs/reviews/OGVCS-042-local-agent-ipc-boundary-review.md'
      - 'prd/todo/OGVCS-042-minimal-local-agent-first-party-ipc.md'
      - 'tools/local-agent-ipc-source-policy.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, r1-foundation-integration]
    paths:
      - '.github/workflows/local-agent-ipc.yml'
      - 'client/local-agent/rust/**'
      - 'core/object-model/rust/**'
      - 'core/paths-filesystem/rust/**'
      - 'foundation/protocol-baseline/bindings/rust/**'
      - 'docs/reviews/OGVCS-042-local-agent-ipc-boundary-review.md'
      - 'prd/todo/OGVCS-042-minimal-local-agent-first-party-ipc.md'
      - 'tools/local-agent-ipc-source-policy.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-agent-ipc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: Private IPC source portability (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, label: Linux }
          - { runner: macos-latest, label: macOS }
          - { runner: windows-latest, label: Windows }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
        with:
          components: clippy, rustfmt
      - run: node --test tools/local-agent-ipc-source-policy.test.mjs
      - run: cargo fetch --manifest-path client/local-agent/rust/Cargo.toml --locked
      - run: cargo fmt --manifest-path client/local-agent/rust/Cargo.toml -- --check
      - run: cargo test --manifest-path client/local-agent/rust/Cargo.toml --locked --offline
      - run: cargo test --manifest-path client/local-agent/rust/Cargo.toml --locked --offline --release
      - run: cargo clippy --manifest-path client/local-agent/rust/Cargo.toml --locked --offline --all-targets -- -D warnings
      - run: sh ./scripts/test-packed.sh
        shell: bash
        working-directory: client/local-agent/rust
      - name: Validate the open roadmap boundary
        if: runner.os == 'Linux'
        run: node prd/validate-roadmap.mjs && node --test prd/validate-roadmap.test.mjs
