name: Object model exact scale (release only)

on:
  workflow_dispatch:
    inputs:
      confirm_exact_scale:
        description: "Run the billed million-entry and logical-1-TiB campaign"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "ogvcs-002-scale-*"

permissions:
  contents: read

concurrency:
  group: object-model-exact-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  javascript-exact-scale:
    if: ${{ github.event_name == 'push' || inputs.confirm_exact_scale == true }}
    name: JavaScript exact million-entry and logical-1-TiB evidence (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare evidence directory
        run: mkdir -p artifacts
      - name: Run JavaScript million-entry and logical-1-TiB checks
        run: node core/object-model/js/scripts/run-scale.mjs > artifacts/javascript-scale.json
      - name: Upload JavaScript exact-scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-model-scale-javascript-Linux
          path: artifacts/javascript-scale.json
          if-no-files-found: error
          retention-days: 30

  rust-exact-scale:
    if: ${{ github.event_name == 'push' || inputs.confirm_exact_scale == true }}
    name: Rust exact million-entry and logical-1-TiB evidence (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
      - name: Prepare evidence directory
        run: mkdir -p artifacts
      - name: Run Rust million-entry and logical-1-TiB checks
        env:
          OGVCS_SCALE_REPORT_PATH: ${{ github.workspace }}/artifacts/rust-scale.json
        run: cargo test --manifest-path core/object-model/rust/Cargo.toml --locked --release --test scale release_scale_tree_and_one_tib_manifest -- --ignored --exact --nocapture
      - name: Upload Rust exact-scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-model-scale-rust-Linux
          path: artifacts/rust-scale.json
          if-no-files-found: error
          retention-days: 30

  compare-exact-scale:
    name: Compare JavaScript and Rust exact-scale evidence (Linux)
    needs:
      - javascript-exact-scale
      - rust-exact-scale
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download JavaScript exact-scale evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: object-model-scale-javascript-Linux
          path: artifacts
      - name: Download Rust exact-scale evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: object-model-scale-rust-Linux
          path: artifacts
      - name: Require byte-identical exact-scale results
        run: node tools/compare-object-model-scale.mjs --javascript artifacts/javascript-scale.json --rust artifacts/rust-scale.json --output artifacts/scale-comparison.json
      - name: Upload combined exact-scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-model-scale-Linux
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
