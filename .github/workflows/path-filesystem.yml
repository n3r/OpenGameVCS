name: Native CLI Windows rename probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-cli-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-rename:
    name: Windows native rename unit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
      - run: cargo test --manifest-path client/native-cli/rust/Cargo.toml --locked --lib windows_security::tests::private_creation_is_protected_and_pinned_against_path_replacement -- --exact --nocapture
