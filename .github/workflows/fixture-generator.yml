name: Fixture generator conformance

on:
  pull_request:
    paths:
      - ".github/workflows/fixture-generator.yml"
      - "foundation/fixture-generator/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fixture-generator.yml"
      - "foundation/fixture-generator/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      run_reference_scale:
        description: "Run the million-path/100-GiB fully streamed reference profile on Linux"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golden-conformance:
    name: Golden conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Windows portable-path and junction conformance
        if: runner.os == 'Windows'
        working-directory: foundation/fixture-generator
        run: node --test --test-concurrency=1 test/path-validation.test.mjs
      - name: Run fixture-generator test suite
        run: npm run test:ci --workspace @opengamevcs/fixture-generator
      - run: node foundation/fixture-generator/scripts/golden-summary.mjs --output golden-summary-${{ runner.os }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-${{ runner.os }}
          path: golden-summary-${{ runner.os }}.json
          if-no-files-found: error

  compare-golden-conformance:
    name: Compare golden summaries
    needs: golden-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: golden-Linux
          path: summaries/Linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: golden-macOS
          path: summaries/macOS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: golden-Windows
          path: summaries/Windows
      - run: cmp summaries/Linux/golden-summary-Linux.json summaries/macOS/golden-summary-macOS.json
      - run: cmp summaries/Linux/golden-summary-Linux.json summaries/Windows/golden-summary-Windows.json

  reference-scale:
    if: github.event_name == 'workflow_dispatch' && inputs.run_reference_scale
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:scale --workspace @opengamevcs/fixture-generator
