name: Repository metadata bounded conformance

on:
  pull_request:
    paths:
      - '.github/workflows/repository-metadata.yml'
      - 'core/object-model/rust/**'
      - 'server/migrations/identity-policy-audit/**'
      - 'server/migrations/repository-metadata/**'
      - 'server/modules/identity-policy-audit/**'
      - 'server/modules/repository-metadata/**'
      - 'spec/benchmark-fault/v1/**'
      - 'spec/object-transfer/v1/**'
      - 'spec/repository-metadata/v1/**'
      - 'docs/changelog/OGVCS-006.md'
      - 'tools/repository-metadata-workflow-policy.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-metadata.yml'
      - 'core/object-model/rust/**'
      - 'server/migrations/identity-policy-audit/**'
      - 'server/migrations/repository-metadata/**'
      - 'server/modules/identity-policy-audit/**'
      - 'server/modules/repository-metadata/**'
      - 'spec/benchmark-fault/v1/**'
      - 'spec/object-transfer/v1/**'
      - 'spec/repository-metadata/v1/**'
      - 'docs/changelog/OGVCS-006.md'
      - 'tools/repository-metadata-workflow-policy.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Locked bounded checks (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, label: macOS }
          - { runner: windows-latest, label: Windows }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:metadata:spec
      - run: npm run test:package --workspace @opengamevcs/repository-metadata-contract-v1
      - run: node server/modules/repository-metadata/scripts/static-check.mjs
      - run: node server/modules/repository-metadata/scripts/service-report.mjs --check
      - run: cargo fetch --manifest-path server/modules/repository-metadata/Cargo.toml --locked
      - run: cargo test --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline
      - run: cargo test --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline --features legacy-test-adapter --test postgres_integration

  linux-postgres:
    name: Locked bounded checks and PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Official postgres:15.19-bookworm OCI index, resolved 2026-08-30.
        image: postgres@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c
        env:
          POSTGRES_DB: ogvcs_metadata_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ogvcs_metadata_test_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@7d11e79e1714f6b6da93cac39ad8435666f5c337 # 1.82.0
        with:
          components: clippy, rustfmt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:metadata:spec
      - run: npm run test:package --workspace @opengamevcs/repository-metadata-contract-v1
      - run: npm run test:metadata
      - run: cargo fetch --manifest-path server/modules/repository-metadata/Cargo.toml --locked
      - run: cargo fmt --manifest-path server/modules/repository-metadata/Cargo.toml -- --check
      - run: cargo test --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline
      - run: cargo clippy --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline --all-targets -- -D warnings
      - run: cargo clippy --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline --all-targets --features legacy-test-adapter -- -D warnings
      - name: Raise the disposable service connection ceiling
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d ogvcs_metadata_test_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_connections = 160"
          docker restart "${{ job.services.postgres.id }}"
          for attempt in {1..60}; do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d ogvcs_metadata_test_ci; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run sealed metadata dispatcher regressions on a fresh database
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'true'
          OGVCS_METADATA_DISPATCH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ogvcs_metadata_dispatch_ci
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres ogvcs_metadata_dispatch_ci
          cargo test --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline --test metadata_dispatcher_live -- --test-threads=1
      - name: Run bounded identity-bound PostgreSQL regressions
        env:
          CARGO_NET_OFFLINE: 'true'
          OGVCS_METADATA_IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ogvcs_metadata_test_ci
        run: cargo test --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline --test identity_binding_live -- --test-threads=1
      - name: Run bounded same-transaction aggregate lifecycle regressions
        env:
          CARGO_NET_OFFLINE: 'true'
          OGVCS_METADATA_AGGREGATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ogvcs_metadata_test_ci
        run: cargo test --manifest-path server/modules/repository-metadata/Cargo.toml --locked --offline --features legacy-test-adapter --test aggregate_bridge_postgres_live -- --test-threads=1
      - name: Run the bounded live PostgreSQL report
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'true'
          OGVCS_METADATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ogvcs_metadata_test_ci
        run: |
          mkdir -p artifacts
          node server/modules/repository-metadata/scripts/service-report.mjs | tee artifacts/repository-metadata-service-report.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repository-metadata-postgres-Linux
          path: artifacts/repository-metadata-service-report.jsonl
          if-no-files-found: error
          retention-days: 14
