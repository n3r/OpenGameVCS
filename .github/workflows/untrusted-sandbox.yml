name: Untrusted parser sandbox boundary

on:
  pull_request:
    paths:
      - ".github/workflows/untrusted-sandbox.yml"
      - "core/untrusted-sandbox/**"
      - "spec/untrusted-sandbox/**"
      - "tools/untrusted-sandbox-workflow-policy.test.mjs"
      - "core/paths-filesystem/js/**"
      - "docs/changelog/OGVCS-045.md"
      - "package.json"
      - "package-lock.json"
      - "prd/todo/OGVCS-045-*.md"
      - "spec/authorization/v1/docs/sandbox-contract.md"
      - "spec/authorization/v1/manifest.json"
      - "spec/identity-policy-audit/v1/manifest.json"
      - "spec/path-filesystem/v1/**"
  push:
    branches: [main, "ogvcs-045/**", "ogvcs045-*", "r1-ogvcs045", "r1-sandbox-worker-v1"]
    paths:
      - ".github/workflows/untrusted-sandbox.yml"
      - "core/untrusted-sandbox/**"
      - "spec/untrusted-sandbox/**"
      - "tools/untrusted-sandbox-workflow-policy.test.mjs"
      - "core/paths-filesystem/js/**"
      - "docs/changelog/OGVCS-045.md"
      - "package.json"
      - "package-lock.json"
      - "prd/todo/OGVCS-045-*.md"
      - "spec/authorization/v1/docs/sandbox-contract.md"
      - "spec/authorization/v1/manifest.json"
      - "spec/identity-policy-audit/v1/manifest.json"
      - "spec/path-filesystem/v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: untrusted-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-conformance:
    name: Credential-free protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run closed protocol and secret-canary vectors
        run: npm run test:sandbox
      - name: Validate candidate lifecycle
        if: runner.os == 'Linux'
        run: npm run test:roadmap

  linux-reference-conformance:
    name: Linux reference isolation and hostile canaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the pinned trusted shim and hostile tool
        run: |
          cc -static -O2 -std=c17 -Wall -Wextra -Werror core/untrusted-sandbox/js/linux/output_shim.c -o core/untrusted-sandbox/js/linux/output-shim
          cc -static -O2 -std=c17 -Wall -Wextra -Werror core/untrusted-sandbox/js/linux/canary_tool.c -o core/untrusted-sandbox/js/linux/canary-tool
          chmod 0555 core/untrusted-sandbox/js/linux/output-shim core/untrusted-sandbox/js/linux/canary-tool
      - name: Import the deterministic one-layer credential-free scratch runtime
        run: |
          runtime_rootfs_dir="$(mktemp -d "${RUNNER_TEMP}/ogvcs-sandbox-rootfs.XXXXXX")"
          runtime_rootfs_tar="${RUNNER_TEMP}/ogvcs-sandbox-rootfs.tar"
          install -m 0555 core/untrusted-sandbox/js/linux/output-shim "${runtime_rootfs_dir}/ogvcs-output-shim"
          test "$(find "${runtime_rootfs_dir}" -mindepth 1 -maxdepth 1 -printf '%f\n')" = "ogvcs-output-shim"
          tar --format=ustar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --mode=0555 --no-recursion -C "${runtime_rootfs_dir}" -cf "${runtime_rootfs_tar}" ogvcs-output-shim
          test "$(tar -tf "${runtime_rootfs_tar}")" = "ogvcs-output-shim"
          docker image import --platform=linux/amd64 \
            --change 'LABEL org.opengamevcs.sandbox.runtime="linux-reference-v1"' \
            --change 'LABEL org.opengamevcs.sandbox.runtime-contract-sha256="930be8bc4d5afb79830736fc1ef4c553dc5ef63e8a38766551cf28047752189d"' \
            "${runtime_rootfs_tar}" ogvcs-sandbox-reference:conformance
          test "$(docker image inspect --format '{{if .Config.Env}}nonempty{{else}}empty{{end}}:{{len .RootFS.Layers}}' ogvcs-sandbox-reference:conformance)" = "empty:1"
          echo "OGVCS_SANDBOX_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' ogvcs-sandbox-reference:conformance)" >> "$GITHUB_ENV"
      - name: Run live Docker/cgroup/seccomp conformance
        env:
          OGVCS_DOCKER_BINARY: /usr/bin/docker
          OGVCS_SANDBOX_CANARY_TOOL: ${{ github.workspace }}/core/untrusted-sandbox/js/linux/canary-tool
          OGVCS_SANDBOX_REPORT_PATH: ${{ github.workspace }}/artifacts/untrusted-sandbox-linux-reference.json
        run: |
          mkdir -p artifacts
          npm run test:linux --workspace @opengamevcs/untrusted-sandbox
      - name: Retain Linux reference evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-sandbox-linux-reference-${{ github.run_attempt }}
          path: artifacts/untrusted-sandbox-linux-reference.json
          if-no-files-found: error
          retention-days: 14
