name: Untrusted parser candidate boundary

on:
  pull_request:
    paths:
      - ".github/workflows/untrusted-sandbox.yml"
      - "core/untrusted-sandbox/**"
      - "spec/untrusted-sandbox/**"
      - "core/paths-filesystem/js/**"
      - "docs/changelog/OGVCS-045.md"
      - "package.json"
      - "package-lock.json"
      - "prd/todo/OGVCS-045-*.md"
      - "spec/authorization/v1/docs/sandbox-contract.md"
      - "spec/authorization/v1/manifest.json"
      - "spec/identity-policy-audit/v1/manifest.json"
      - "spec/path-filesystem/v1/**"
  push:
    branches: [main, "ogvcs-045/**", "ogvcs045-*", "r1-ogvcs045"]
    paths:
      - ".github/workflows/untrusted-sandbox.yml"
      - "core/untrusted-sandbox/**"
      - "spec/untrusted-sandbox/**"
      - "core/paths-filesystem/js/**"
      - "docs/changelog/OGVCS-045.md"
      - "package.json"
      - "package-lock.json"
      - "prd/todo/OGVCS-045-*.md"
      - "spec/authorization/v1/docs/sandbox-contract.md"
      - "spec/authorization/v1/manifest.json"
      - "spec/identity-policy-audit/v1/manifest.json"
      - "spec/path-filesystem/v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: untrusted-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-conformance:
    name: Credential-free protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run closed protocol and secret-canary vectors
        run: npm run test:sandbox
      - name: Validate candidate lifecycle
        if: runner.os == 'Linux'
        run: npm run test:roadmap
