[package]
name = "ogvcs-repository-metadata"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Transactional repository metadata domain and PostgreSQL migration contract"
publish = false

[features]
default = []
# Enables the caller-context compatibility adapter only for the repository's
# bounded legacy PostgreSQL harness. Production builds must use the
# OGVCS-009-bound `IdentityBoundPostgresMetadataStore` constructor.
legacy-test-adapter = []

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.2.16"
hmac = "=0.12.1"
ogvcs-identity-policy-audit-postgres = { path = "../identity-policy-audit" }
ogvcs-object-model = { path = "../../../core/object-model/rust" }
opengamevcs-protocol-v1 = { path = "../../../foundation/protocol-baseline/bindings/rust" }
postgres = { version = "=0.19.10", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
unicode-normalization = "=0.1.24"
uuid = "=1.18.1"

[[test]]
name = "postgres_integration"
required-features = ["legacy-test-adapter"]

[[test]]
name = "aggregate_bridge_postgres_live"
required-features = ["legacy-test-adapter"]
