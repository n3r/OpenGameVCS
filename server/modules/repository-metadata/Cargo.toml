[package]
name = "ogvcs-repository-metadata"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Transactional repository metadata domain and PostgreSQL migration contract"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.2.16"
ogvcs-object-model = { path = "../../../core/object-model/rust" }
postgres = { version = "=0.19.10", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
uuid = "=1.18.1"
