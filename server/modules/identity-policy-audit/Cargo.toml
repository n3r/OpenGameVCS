[package]
name = "ogvcs-identity-policy-audit-postgres"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Same-transaction PostgreSQL identity and authorization participant"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
getrandom = "=0.2.16"
postgres = { version = "=0.19.10", features = ["with-serde_json-1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
unicode-normalization = "=0.1.24"

