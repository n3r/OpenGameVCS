[package]
name = "ogvcs-integrity-verifier"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Private bounded read-only OpenGameVCS integrity verifier candidate"
readme = "README.md"
publish = false
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[lib]
path = "src/lib.rs"

[dependencies]
ogvcs-chunking-manifest = { path = "../../chunking-manifest/rust", version = "0.1.0" }
ogvcs-object-model = { path = "../../object-model/rust", version = "0.1.0" }

[dev-dependencies]
serde_json = "=1.0.151"
