[package]
name = "ogvcs-selective-sync-kernel"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Private bounded OpenGameVCS selective-sync selection kernel candidate"
readme = "README.md"
publish = false
include = [
    "src/**",
    "scripts/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[lib]
path = "src/lib.rs"

[dependencies]
ogvcs-path-contract = { path = "../../paths-filesystem/rust", version = "1.0.0" }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.151"
